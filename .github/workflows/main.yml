name: CI & CD

on:
  push:

jobs:
  Test-and-Package:
    name: Test & Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            testOutputPath: out/npm2exe
            releaseAssetPath: out/npm2exe-linux-x64
          - os: macos-latest
            label: macos
            testOutputPath: out/npm2exe
            releaseAssetPath: out/npm2exe-macos
          - os: windows-latest
            label: windows-x64
            testOutputPath: out/npm2exe.exe
            releaseAssetPath: out/npm2exe-windows-x64.exe
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: npm t

      - name: Prepare release asset
        run: node -e "require('node:fs').copyFileSync(process.argv[1], process.argv[2])" "${{ matrix.testOutputPath }}" "${{ matrix.releaseAssetPath }}"

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.releaseAssetPath }}
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.releaseAssetPath }}
          generate_release_notes: true

  Publish-NPM:
    if: ${{ startsWith(github.ref, 'refs/tags/') && secrets.NPM_TOKEN != '' }}
    needs: Test-and-Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish package
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
