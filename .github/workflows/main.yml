name: CI & CD

on:
  push:

jobs:
  Test-and-Package:
    name: Test & Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      ASSET_PATH: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            outputExtension: ""
          - os: macos-latest
            label: macos
            outputExtension: ""
          - os: windows-latest
            label: windows-x64
            outputExtension: ".exe"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        if: ${{ matrix.os != 'windows-latest' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm test

      - name: Test on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test-win

      - name: Read package metadata
        shell: pwsh
        run: |
          $packageName = jq -r '(.name | ltrimstr("@") | gsub("/"; "-"))' package.json
          $packageFile = "out/$packageName${{ matrix.outputExtension }}"
          $assetPath = "out/$packageName-${{ matrix.label }}${{ matrix.outputExtension }}"
          "PACKAGE_FILE=$packageFile" >> $env:GITHUB_ENV
          "ASSET_PATH=$assetPath" >> $env:GITHUB_ENV

      - name: Rename release asset
        shell: pwsh
        run: cp "$env:PACKAGE_FILE" "$env:ASSET_PATH"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
          archive: false

  Publish-Release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: Test-and-Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Find previous tag
        id: previous
        run: |
          tag=$(git describe --tags --match 'v*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
          fail_on_unmatched_files: true
          previous_tag: ${{ steps.previous.outputs.tag }}
          generate_release_notes: ${{ steps.existing.outputs.exists != 'true' }}

  Publish-NPM:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: Test-and-Package
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - if: ${{ env.NODE_AUTH_TOKEN != '' }}
        uses: actions/checkout@v7

      - if: ${{ env.NODE_AUTH_TOKEN != '' }}
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - if: ${{ env.NODE_AUTH_TOKEN != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: pnpm install --frozen-lockfile

      - name: Publish package
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: pnpm publish --access public --provenance --no-git-checks
