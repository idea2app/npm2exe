name: CI & CD

on:
  push:

jobs:
  Test-and-Package:
    name: Test & Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            outputExtension: ''
          - os: macos-latest
            label: macos
            outputExtension: ''
          - os: windows-latest
            label: windows-x64
            outputExtension: '.exe'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npm test

      - name: Read package name
        id: packageName
        shell: pwsh
        run: jq -r '"value=" + (.name | ltrimstr("@") | gsub("/"; "-"))' package.json | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Rename release asset
        shell: pwsh
        run: cp "out/${{ steps.packageName.outputs.value }}${{ matrix.outputExtension }}" "out/${{ steps.packageName.outputs.value }}-${{ matrix.label }}${{ matrix.outputExtension }}"

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/${{ steps.packageName.outputs.value }}-${{ matrix.label }}${{ matrix.outputExtension }}
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ steps.packageName.outputs.value }}-${{ matrix.label }}${{ matrix.outputExtension }}
          generate_release_notes: true

  Publish-NPM:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.NPM_TOKEN != '' }}
    needs: Test-and-Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish package
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
